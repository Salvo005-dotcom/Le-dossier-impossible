<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),stage=$('stage');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choices=(...items)=>items.map(a=>typeof a==='string'?{title:a}:a);
const missions=[
{icon:'🗂️',name:'Le fichier introuvable',short:'Retrouver',tag:'Trier les indices',scene:'Message de la coordination',brief:'« Pour la réunion de demain, retrouve les documents vraiment utilisables. Attention : le mot FINAL ne signifie pas forcément VALIDÉ. »',lesson:'Un document pertinent est celui qui répond au besoin ET dont le statut, le format et l’origine sont vérifiables.',questions:[
{ask:'Quel déroulé de séance peux-tu transmettre aux collègues pour qu’ils puissent le modifier ?',context:'Demande : un déroulé de l’atelier EMI, modifiable et approuvé par la coordination.',opts:choices({title:'Atelier_EMI_final_v4.docx',desc:'17/11 · Brouillon · Corrections encore demandées'},{title:'2026-11-12_EMI_deroule_v02_VALIDE.docx',desc:'12/11 · Validé · Document modifiable'},{title:'EMI_support_ok.pdf',desc:'12/11 · Validé · Support de projection en PDF'}),correct:1,hint:'Repère à la fois le format modifiable et le statut de validation.',why:'La version DOCX validée répond aux deux conditions. « final_v4 » n’est qu’un nom : les métadonnées disent « brouillon ».'},
{ask:'Quel fichier utiliserais-tu pour établir le bilan des inscriptions ?',context:'La coordination veut un export contrôlé, pas nécessairement le plus récent.',opts:choices({title:'inscriptions_2026_final_v3.csv',desc:'16/11 · Export de test · Doublon non corrigé'},{title:'inscriptions_avant_correction.csv',desc:'08/11 · Version obsolète · Doublons'},{title:'2026-11-10_ProjetNUM_inscriptions_v02_VALIDE.csv',desc:'10/11 · Extraction validée · Contrôles documentés'}),correct:2,hint:'Ne te fie pas au nom ni à la date : la validation est déterminante.',why:'Un fichier contrôlé le 10/11 est préférable à un export de test plus récent.'},
{ask:'Quelle fiche privilégier pour les collègues qui doivent réutiliser le contenu ?',context:'Le document doit être consultable et accessible au maximum de personnes.',opts:choices({title:'fiche_accessible_versionfinale.pdf',desc:'PDF image · Texte impossible à sélectionner'},{title:'2026-11-15_EMI_fiche-synthese_v03_VALIDE.pdf',desc:'PDF validé · Texte sélectionnable · Titres structurés'},{title:'fiche_EMI_reprise-site-inconnu.pdf',desc:'Copie récente · Auteur et droits inconnus'}),correct:1,hint:'L’accessibilité du texte et la provenance comptent autant que la date.',why:'La deuxième fiche est structurée, validée et plus exploitable. Son nom n’est pas le seul indice.'},
{ask:'Le nom « Compte_rendu_FINAL.docx » suffit-il à décider de l’envoyer ?',context:'Le fichier se trouve dans un dossier partagé ; tu ne connais ni son auteur ni son statut d’approbation.',opts:choices('Oui : FINAL garantit qu’il est prêt.','Non : je vérifie le responsable, la validation et le contenu.','Oui, si la date de modification est récente.'),correct:1,hint:'Un nom de fichier ne constitue jamais une preuve de validation.',why:'Le statut réel, l’auteur et la validation doivent être établis avant diffusion.'}]},
{icon:'🧩',name:'La bataille des versions',short:'Versions',tag:'Décoder le statut',scene:'Alerte du secrétariat',brief:'« Nous avons des brouillons, des archives et des versions dites finales. Peux-tu distinguer ce qui doit être diffusé de ce qui doit rester en travail ? »',lesson:'Des noms cohérents et un statut explicite réduisent les confusions ; le nommage doit correspondre au processus réel de validation.',questions:[
{ask:'Quel nom est le plus clair pour une fiche EMI validée le 12 novembre 2026, version 2 ?',context:'Convention de l’établissement : AAAA-MM-JJ_Projet_Objet_vXX_STATUT.extension',opts:choices('fiche_ok_finale_definitive.docx','2026-11-12_EMI_fiche-animation_v02_VALIDE.docx','12-11-26_Emi_bon-v2.docx'),correct:1,hint:'Date ISO + projet + objet + numéro de version + statut.',why:'Le nom retenu permet de retrouver la date, le contenu, la version et la validation.'},
{ask:'Un fichier mis à jour aujourd’hui porte « BROUILLON ». Un autre, plus ancien, porte « VALIDÉ ». Lequel diffuser ?',context:'La coordination demande la dernière version approuvée, sans modifications non contrôlées.',opts:choices('Le brouillon, puisqu’il est plus récent.','Les deux fichiers, sans avertissement.','La version validée, en indiquant que des révisions sont en cours.'),correct:2,hint:'La date de modification et l’approbation sont deux informations distinctes.',why:'Diffuser un brouillon comme version de référence peut introduire des modifications non vérifiées.'},
{ask:'Une version v03 remplace une v02, déjà utilisée par plusieurs collègues. Que faire de v02 ?',context:'L’équipe doit pouvoir retrouver les décisions prises à l’époque.',opts:choices('Archiver v02 en indiquant qu’elle est remplacée.','Supprimer immédiatement v02 sans trace.','Renommer v02 en v03 pour conserver deux versions identiques.'),correct:0,hint:'Pense à l’historique et à la possibilité de reconstituer une décision.',why:'Conserver une version antérieure identifiée comme telle garantit la traçabilité sans la confondre avec la version active.'},
{ask:'Un collègue propose de mettre les noms des élèves dans les noms de fichiers d’évaluation.',context:'Les fichiers seront synchronisés dans un espace partagé avec plusieurs utilisateurs.',opts:choices('C’est indispensable pour pouvoir rechercher rapidement.','Il vaut mieux adopter des identifiants adaptés et limiter l’exposition de données personnelles.','Il suffit de mettre « privé » dans le nom du fichier.'),correct:1,hint:'Un nom de fichier peut être visible dans des listes, notifications et historiques.',why:'Le nommage doit rester utile tout en évitant d’exposer inutilement des informations identifiantes.'}]},
{icon:'📁',name:'Le labyrinthe des dossiers',short:'Classer',tag:'Reconstituer l’arborescence',scene:'Intervention de l’équipe informatique',brief:'« Nous avons préparé cinq espaces. Classe les fichiers un par un, en fonction de leur usage actuel. Tu peux réfléchir avant chaque choix. »',lesson:'Une bonne arborescence distingue les documents validés, les sources conservées intactes, les travaux en cours, les archives et les éléments à vérifier.',folders:true,questions:[
{ask:'Déroulé_EMI_v02_VALIDE.docx',context:'Document approuvé et prêt à être utilisé en classe.',correct:0},
{ask:'inscriptions_SOURCE_v01.csv',context:'Export brut d’origine, à préserver sans modification.',correct:1},
{ask:'Atelier_EMI_v04_BROUILLON.docx',context:'Réécriture en cours, pas encore approuvée.',correct:2},
{ask:'graphique_usage_v01.png',context:'Ancienne visualisation remplacée par une version validée plus récente.',correct:3},
{ask:'photo_brochure.jpg',context:'Image trouvée en ligne, sans auteur ni droits de réutilisation établis.',correct:4},
{ask:'fiche_pratique_EMI_v03_VALIDE.pdf',context:'Document accessible, contrôlé et destiné aux enseignants.',correct:0},
{ask:'article_anonyme_copie.html',context:'Copie sans URL, date ni auteur identifiables.',correct:4},
{ask:'inscriptions_TEST_v03.csv',context:'Export d’essai contenant des doublons.',correct:2}],folderOptions:[{title:'01 · Validés',desc:'À partager et réutiliser',symbol:'✓'},{title:'02 · Sources',desc:'Fichiers originaux non modifiés',symbol:'⬡'},{title:'03 · Travail',desc:'Brouillons et essais',symbol:'✎'},{title:'04 · Archives',desc:'Anciennes versions identifiées',symbol:'▣'},{title:'99 · À vérifier',desc:'Origine ou droits incertains',symbol:'?'}]},
{icon:'🔎',name:'Les sources fantômes',short:'Tracer',tag:'Remonter aux preuves',scene:'Message du documentaliste',brief:'« Les ressources existent, mais certaines ont perdu leur origine. Un autre enseignant doit pouvoir retrouver les mêmes sources, comprendre leur statut et vérifier leur réutilisation. »',lesson:'La traçabilité repose sur des références retrouvables, des métadonnées utiles, et la distinction entre source originale et copie.',questions:[
{ask:'Une statistique publiée dans un billet indique « 68 % des enseignants », sans lien vers l’enquête.',context:'La source et la méthode de collecte ne sont pas précisées.',opts:choices('La conserver : le pourcentage semble réaliste.','Rechercher le rapport d’origine, son échantillon et sa méthode.','Citer trois blogs qui reproduisent le même chiffre.'),correct:1,hint:'Une répétition de l’affirmation n’est pas nécessairement une confirmation indépendante.',why:'La valeur seule ne permet pas de juger la fiabilité de la statistique.'},
{ask:'Tu télécharges un fichier depuis un portail institutionnel. Que conserver dans ton index ?',context:'Le fichier pourrait être actualisé sur le site source.',opts:choices('Seulement le nom de fichier.','L’URL, le producteur, la date de consultation ou de téléchargement, la version et les conditions d’usage.','Une capture d’écran du bouton « Télécharger ».'),correct:1,hint:'Réfléchis à ce qu’un collègue devrait savoir pour retrouver la même version.',why:'L’index doit rendre la provenance et la réutilisation vérifiables.'},
{ask:'Une image trouvée sur un réseau social paraît parfaite pour la brochure.',context:'Aucun auteur, source primaire ni licence ne sont indiqués.',opts:choices('La publier avec la mention « source : Internet ».','Retrouver l’origine et les droits avant toute réutilisation.','Supprimer le filigrane pour obtenir une illustration plus propre.'),correct:1,hint:'La présence sur Internet ne signifie pas libre réutilisation.',why:'Sans provenance ni conditions d’usage établies, la réutilisation n’est pas justifiée.'},
{ask:'Un outil d’IA cite trois études à l’appui d’un résumé ; deux références sont introuvables.',context:'Le résumé est pourtant fluide et convaincant.',opts:choices('Citer le résumé sans modification.','Conserver les références plausibles et ignorer les deux autres.','Vérifier chaque référence ; écarter ou signaler les affirmations non étayées.'),correct:2,hint:'La qualité rédactionnelle ne garantit pas l’existence des sources.',why:'Les références d’une IA nécessitent un contrôle indépendant avant réutilisation.'}]},
{icon:'📊',name:'Le tableau piégé',short:'Analyser',tag:'Vérifier avant de calculer',scene:'Demande du coordinateur',brief:'« Prépare un chiffre de fréquentation à partir du tableau ci-dessous. Certaines lignes sont douteuses. Attention à ne pas transformer un manque d’information en zéro. »',lesson:'Un résultat chiffré n’est réutilisable que si l’on peut décrire les données retenues, les exclusions, les anomalies et les limites du calcul.',table:true,questions:[
{ask:'Quelle ligne présente un doublon de dossier ?',context:'Une ligne est la copie exacte d’une inscription déjà présente.',opts:choices('Ligne 4 (A03)','Ligne 5 (A04)','Ligne 6 (A05)'),correct:0,hint:'Compare les identifiants et les valeurs associées.',why:'A03 apparaît déjà à la ligne 3 : la ligne 4 est un doublon à examiner avant calcul.'},
{ask:'Comment interpréter l’effectif manquant de la ligne 5 ?',context:'L’effectif du groupe 2B n’est pas encore confirmé.',opts:choices('Le remplacer par zéro sans commentaire.','Le remplacer par la moyenne des autres groupes sans le signaler.','Le laisser inconnu et signaler la limite de l’analyse.'),correct:2,hint:'Une case vide et un zéro ne signifient pas la même chose.',why:'Inventer une valeur fausserait le total et empêcherait d’identifier les données incomplètes.'},
{ask:'Le groupe 3A a un effectif de 0, mais la ligne est validée. Que faire ?',context:'Il est possible qu’aucun participant ne se soit inscrit à cet atelier.',opts:choices('Conserver 0 comme valeur valide.','Supprimer la ligne, car 0 est toujours une erreur.','Remplacer le 0 par 1 pour éviter un problème de graphique.'),correct:0,hint:'Un zéro contrôlé est une information ; une valeur manquante ne l’est pas.',why:'Une valeur nulle validée doit rester distincte d’une donnée inconnue.'},
{ask:'Quel bilan peux-tu annoncer à la direction ?',context:'Les inscriptions uniques contrôlées totalisent 12 + 15 + 18 + 0 + 17.',opts:choices('62 participations contrôlées ; le total global reste incomplet.','62 participations pour l’ensemble de l’établissement, sans réserve.','80 participations, en ajoutant une seconde fois le dossier A03.'),correct:0,hint:'Déduplique A03, garde le zéro valide et laisse l’effectif manquant inconnu.',why:'62 est la somme des lignes uniques contrôlées ; le groupe 2B reste non renseigné.'}]},
{icon:'🚀',name:'La livraison finale',short:'Livrer',tag:'Décider avant de partager',scene:'Dernier message de la direction',brief:'« Le dossier va être ouvert aux collègues. Vérifie maintenant que le partage, les versions, l’index et les limites du bilan sont cohérents. »',lesson:'Un dossier prêt à diffuser doit être utilisable, documenté et accompagné des réserves nécessaires : ce n’est pas simplement un ensemble de fichiers rangés.',questions:[
{ask:'Comment diffuser le déroulé validé aux collègues sans risquer une modification accidentelle ?',context:'Les utilisateurs doivent le consulter, pas le modifier.',opts:choices('Partager un lien en consultation pour la version validée.','Donner un accès en modification à toute personne possédant le lien.','Envoyer uniquement la version brouillon la plus récente.'),correct:0,hint:'Attribue les droits nécessaires, pas davantage.',why:'Un accès en lecture à la bonne version limite les modifications involontaires.'},
{ask:'Que faire de la photographie sans auteur ni licence identifiés ?',context:'Elle figure dans le dossier destiné à une brochure pédagogique.',opts:choices('La publier avec la mention « trouvé sur le Web ».','La maintenir hors diffusion tant que ses droits ne sont pas vérifiés.','La renommer pour masquer son origine.'),correct:1,hint:'La mention « trouvé sur le Web » ne permet pas d’établir les droits de réutilisation.',why:'La disponibilité d’un fichier ne garantit pas son autorisation de réutilisation.'},
{ask:'Comment présenter le bilan des inscriptions ?',context:'Le fichier contient une valeur manquante, un doublon et un zéro validé.',opts:choices('Présenter un total global sans réserve.','Supprimer les lignes gênantes sans explication.','Documenter le nettoyage, les lignes retenues et les limites du total.'),correct:2,hint:'Un collègue doit pouvoir comprendre exactement comment le résultat a été produit.',why:'La reproductibilité exige d’expliciter les traitements et les incertitudes.'},
{ask:'Quel élément aidera le plus une nouvelle collègue à retrouver les ressources dans six mois ?',context:'Elle n’a participé à aucune des réunions de préparation.',opts:choices('Un index clair reliant fichiers, sources, versions, dates et statut.','Une liste de captures d’écran sans lien ni date.','Un message disant « demande-moi si besoin ».'),correct:0,hint:'La réutilisation suppose que l’auteur initial n’ait pas besoin d’être présent.',why:'L’index documenté rend l’ensemble compréhensible sans dépendre de la mémoire du créateur.'}]}

function dataTable(){return `<div class="table-shell"><table class="data-table"><thead><tr><th>Ligne</th><th>ID</th><th>Groupe</th><th>Effectif</th><th>Statut</th></tr></thead><tbody>${dataRows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">Jeu de données fictif. Une copie de ligne n’est pas une inscription supplémentaire.</p>`;}
function question(){
 const m=missions[S.mi],q=m.questions[S.qi],options=q.opts||m.folderOptions;
 const opts=options.map((o,i)=>{const priorWrong=S.attempts.includes(i)&&i!==q.correct;
  const cls=[m.folders?'foldermode':'',priorWrong?'tried':'',S.selected===i?(S.ok?'good':'bad'):'',S.revealed&&i===q.correct?'good':''].join(' ');
  return `<button class="option ${cls}" data-choice="${i}" ${S.ok||S.revealed||priorWrong?'disabled':''}><span class="key">${m.folders?esc(o.symbol):String.fromCharCode(65+i)}</span><span><span class="opt-title">${esc(o.title)}</span>${o.desc?`<span class="opt-desc">${esc(o.desc)}</span>`:''}</span></button>`;
 }).join('');
 const feedback=S.ok||S.revealed?`<div class="feedback ${S.ok?'good':'note'}" role="status"><p class="cheer">${esc(S.message)}</p><span class="delta ${S.ok?'':'negative'}">${S.ok?`+${STAR_BONUS} étoiles`:`Deux mauvaises réponses, ${S.questionLoss} étoile${S.questionLoss>1?'s':''} perdue${S.questionLoss>1?'s':''}`}</span><strong>Pourquoi cette réponse est-elle correcte ?</strong><p><b>Réponse : ${esc(options[q.correct].title)}.</b> ${esc(q.why||folderWhy(m,q))}</p></div>`
  :S.tries===1?`<div class="feedback bad" role="status"><p class="cheer">${esc(S.message)}</p><p>−${Math.abs(S.lastDelta)} étoiles. Il reste <strong>une seule tentative</strong>. Tu ne peux pas sélectionner de nouveau une réponse déjà essayée.</p></div>`:'';
 return `<div class="quest-head"><div><p class="level">Mission ${S.mi+1} / 6 · ${esc(m.tag)}</p><h2 class="subhead">${esc(m.icon)} ${esc(m.name)}</h2></div><div class="mini-progress" role="progressbar" aria-label="Progression de la mission" aria-valuemin="0" aria-valuemax="${m.questions.length}" aria-valuenow="${S.qi}"><div style="width:${Math.round(100*S.qi/m.questions.length)}%"></div></div></div>
 <div class="scene"><div class="avatar" aria-hidden="true">${esc(m.icon)}</div><div><strong>${esc(m.scene)}</strong><p>${esc(m.brief)}</p></div></div>
 <div class="questionboard"><div class="qb-top"><strong>Question ${S.qi+1} sur ${m.questions.length}</strong><span class="trialchip">${S.ok?'Réponse validée':S.revealed?'Question perdue':S.tries===1?'Un dernier essai':'Deux essais possibles'}</span></div>
 <div class="qb-body"><p class="prompt">${esc(q.ask)}</p>${q.context?`<div class="context"><strong>Information disponible :</strong> ${esc(q.context)}</div>`:''}${m.table?dataTable():''}
 <div class="instruction">🎯 ${m.folders?'Choisis le bon dossier':'Choisis la réponse la plus juste'}</div><div class="options ${m.folders?'foldermode':''}">${opts}</div>
 ${S.hint?`<div class="hintbox"><strong>Indice :</strong> ${esc(q.hint||'Classe le fichier selon son usage actuel et non simplement selon son extension.')}</div>`:''}
 ${feedback}
 <div class="helper"><div class="left">${!S.ok&&!S.revealed?`<button class="btn secondary small" data-action="hint">${S.hint?'Masquer l’indice':'💡 Voir un indice'}</button>`:`<button class="btn" data-action="next">${S.qi===m.questions.length-1?'Terminer cette mission':'Question suivante →'}</button>`}</div><span class="note">${S.tries===1?'Dernier essai pour cette question.':'La correction est affichée après une bonne réponse ou deux erreurs.'}</span></div>
 </div></div>`;
}
function folderWhy(m,q){return `Ce fichier appartient à « ${(q.opts||m.folderOptions)[q.correct].title} » : ${q.context}`;}
const MISSION_ENDINGS=[
 {strong:'Première mission accomplie, {nom} ! Tu as retrouvé les bons fichiers malgré les fausses pistes.',mixed:'Première mission terminée, {nom} ! Les indices t’ont parfois résisté, mais tu as retrouvé ton chemin.'},
 {strong:'Deuxième mission bouclée, {nom} ! Les numéros de version et les validations n’ont plus de secrets pour toi.',mixed:'Deuxième mission achevée, {nom} ! Certaines versions t’ont fait hésiter : tu connais maintenant le critère qui les départage.'},
 {strong:'Troisième mission réussie, {nom} ! Tu as remis de l’ordre dans un classement qui ne pardonnait pas les raccourcis.',mixed:'Troisième mission terminée, {nom} ! Plusieurs emplacements semblaient possibles : les corrections éclairent les pièges.'},
 {strong:'Quatrième mission validée, {nom} ! Tu as remonté la piste des ressources et retrouvé leurs preuves.',mixed:'Quatrième mission achevée, {nom} ! La provenance réserve des surprises, et tu as terminé l’enquête.'},
 {strong:'Cinquième mission accomplie, {nom} ! Tu as interprété les données sans confondre manque et zéro.',mixed:'Cinquième mission terminée, {nom} ! Les chiffres étaient piégés ; leurs limites sont maintenant plus visibles.'},
 {strong:'Sixième mission accomplie, {nom} ! Tu as sécurisé la livraison : le dossier est prêt pour son bilan.',mixed:'Sixième et dernière mission achevée, {nom} ! Tu as traversé les six étapes ; découvrons maintenant ton bilan.'}
];
function missionEnding(index,z){const a=MISSION_ENDINGS[index];return (z.revealed===0&&z.first>=Math.ceil(z.total*.75)?a.strong:a.mixed).replaceAll('{nom}',S.playerName);}
function cleared(){const m=missions[S.mi],z=zoneStats(S.mi);return `<div class="clear"><div class="clear-icon" aria-hidden="true">${esc(m.icon)}</div><p class="eyebrow">ÉTAPE TERMINÉE · ${S.mi+1} / 6</p><h2>${esc(missionEnding(S.mi,z))}</h2><p class="lead" style="margin-left:auto;margin-right:auto">${z.first} bonne(s) réponse(s) du premier coup sur ${z.total} · ${z.recovered} rattrapée(s) · ${z.revealed} question(s) perdue(s).</p><div class="reward">✦ ${esc(m.short)} · Étape franchie</div><div class="lesson"><strong>À retenir</strong><p>${esc(m.lesson)}</p></div><div class="actions" style="justify-content:center"><button class="btn" data-action="next-zone">${S.mi===5?'Voir mon bilan personnel':'Continuer l’enquête →'}</button></div></div>`;}

function personalNarrative(){
 const stats=allStats(),total=formativeSummary(),rank=level();
 const merits=z=>(z.first+z.recovered*.55-z.revealed*.45)/z.total;
 const best=[...stats].sort((a,b)=>merits(b)-merits(a)||a.mi-b.mi)[0];
 const weak=[...stats].sort((a,b)=>merits(a)-merits(b)||b.revealed-a.revealed||a.mi-b.mi)[0];
 const bestName=missions[best.mi].name.toLowerCase();
 const weakName=missions[weak.mi].name.toLowerCase();
 let a;
 if(total.first===nQuestions){a=`${S.playerName}, tu as répondu correctement du premier coup aux ${nQuestions} décisions du jeu, sans aucune erreur. C’est un parcours particulièrement régulier.`;}
 else if(total.revealed===0){a=`${S.playerName}, tu as mené toute l’enquête sans perdre de question. Tu as réussi ${total.first} décisions du premier coup et corrigé ${total.recovered} choix après une première erreur.`;}
 else if(total.first>=Math.ceil(nQuestions*.7)){a=`${S.playerName}, ton parcours montre une bonne précision : ${total.first} décisions justes au premier essai sur ${nQuestions}. Tu as aussi su te reprendre ${total.recovered} fois, même si ${total.revealed} question(s) ont été perdues.`;}
 else{a=`${S.playerName}, tu as terminé les six missions et tu disposes maintenant d’un retour précis sur tes décisions. Sur ${nQuestions} situations, ${total.first} ont été résolues du premier coup, ${total.recovered} après une première erreur, et ${total.revealed} ont été perdues.`;}
 let b;
 if(best.first+best.recovered===0){b='Dans ce parcours, aucune question n’a encore été résolue en deux essais. Les corrections indiquent les critères utiles pour distinguer les réponses et pourront servir de repères lors d’une nouvelle partie.';}
 else if(merits(best)>=.75){b=`Ton point fort le plus net est « ${bestName} » : ${best.first} bonne(s) réponse(s) du premier coup sur ${best.total}, ${best.recovered} rattrapée(s) et ${best.revealed} perdue(s). Tes choix sont particulièrement réguliers dans cette mission.`;}
 else{b=`Tes meilleurs résultats relatifs apparaissent dans « ${bestName} » : ${best.first} réponse(s) du premier coup sur ${best.total}, ${best.recovered} rattrapée(s) et ${best.revealed} perdue(s). C’est un point d’appui, même si plusieurs décisions ont encore demandé des ajustements.`;}
 let c;
 if(total.first===nQuestions){c='Aucun point faible n’apparaît dans tes réponses. La prochaine étape consiste simplement à transférer cette rigueur dans un environnement documentaire réel, avec ses cas particuliers.';}
 else if(weak.mi===best.mi){c=`Les résultats sont relativement homogènes entre les missions. Pour gagner en précision, examine le statut réel des documents, leur historique et leur provenance plutôt que les indices de surface. Ce bilan reflète seulement tes réponses dans le jeu.`;}
 else{c=`La principale marge de progression concerne « ${weakName} » : ${weak.revealed} question(s) perdue(s) et ${weak.wrong} erreur(s) au total. ${missions[weak.mi].lesson} Ce bilan décrit ton parcours dans le jeu ; il ne constitue pas un jugement sur tes compétences professionnelles.`;}
 return [a,b,c];
}
function narrativeHTML(){return `<section class="personal-story" aria-label="Bilan personnalisé"><div class="story-heading"><span class="story-icon" aria-hidden="true">📝</span><div><p class="eyebrow">COMPTE RENDU PERSONNEL</p><h2>Ce que révèlent tes décisions</h2></div></div>${personalNarrative().map(p=>`<p>${esc(p)}</p>`).join('')}</section>`;}

function finish(){const l=level(),st=formativeSummary();
 return `<p class="eyebrow">FIN DE L’ENQUÊTE · RAPPORT DE MISSION</p><div class="final-banner"><div class="final-badge" aria-hidden="true">🏆</div><div><h1 class="display">Mission terminée, <em>${esc(S.playerName)} !</em></h1><p class="lead">Le dossier a été examiné jusqu’au bout. Découvre ton niveau et ton rapport personnel d’enquête.</p></div></div>
 <section class="rankpanel" aria-label="Niveau atteint"><div class="rankicon" aria-hidden="true">${l.icon}</div><div><div class="eyebrow" style="margin:0">TON NIVEAU DANS LE JEU</div><div class="rankname">${esc(l.name)}</div><div><strong>${S.score} étoiles</strong> sur ${maxStars} possibles</div><div class="rankstrip" role="progressbar" aria-label="Étoiles obtenues" aria-valuemin="0" aria-valuemax="${maxStars}" aria-valuenow="${S.score}"><div style="width:${Math.round(100*S.score/maxStars)}%"></div></div><p class="ranknote">${esc(l.message)}</p></div></section>
 <div class="reportgrid"><div class="stat"><strong>${st.first} / ${nQuestions}</strong><span>Bonnes réponses du premier coup</span></div><div class="stat"><strong>${st.recovered}</strong><span>Réponses rattrapées</span></div><div class="stat"><strong>${st.revealed}</strong><span>Questions perdues</span></div><div class="stat"><strong>${st.errors}</strong><span>Erreurs commises</span></div><div class="stat"><strong>${st.hints}</strong><span>Indices consultés</span></div><div class="stat"><strong>${S.score} ⭐</strong><span>Étoiles finales</span></div></div>
 ${narrativeHTML()}
 <h2 class="section-title">Ton parcours en six missions</h2><div class="zoneanalyses">${allStats().map(z=>`<article class="zone-card"><h3>${esc(missions[z.mi].icon)} ${esc(missions[z.mi].name)}</h3><strong>${humanZone(z)}</strong><div class="zone-bar" role="progressbar" aria-label="Réponses correctes du premier coup" aria-valuemin="0" aria-valuemax="${z.total}" aria-valuenow="${z.first}"><div style="width:${Math.round(z.ratio*100)}%"></div></div><p class="numbers">${z.first}/${z.total} du premier coup · ${z.recovered} rattrapée(s) · ${z.revealed} perdue(s)</p></article>`).join('')}</div>
 <div class="level-scale"><b>Les niveaux sont des repères de jeu :</b> ${esc(levelScale())}. Ils ne constituent pas une évaluation certificative.</div>
 <div class="mission-frame end-actions"><strong>TON BILAN À CONSERVER</strong><p>Le fichier téléchargé reprend la présentation graphique du jeu, ton niveau, les résultats des six missions et ton analyse personnelle. Il peut être ouvert hors ligne et imprimé en PDF.</p><div class="actions"><button class="btn" data-action="download-html">📥 Télécharger mon bilan illustré</button><button class="btn secondary" data-action="restart">↻ Rejouer</button></div><p class="privacy-foot">Ton pseudo et tes réponses sont traités uniquement dans ce navigateur. Rien n’est envoyé à un serveur par le jeu.</p></div>`;
}

function render(){status();stage.innerHTML=S.mode==='welcome'?welcome():S.mode==='play'?question():S.mode==='clear'?cleared():finish();}
function pick(n){
 if(S.mode!=='play'||S.ok||S.revealed)return;
 const q=missions[S.mi].questions[S.qi];
 // Un même choix erroné ne peut pas être sélectionné une seconde fois.
 if(S.attempts.includes(n))return;
 S.selected=n;S.attempts.push(n);
 if(n===q.correct){
   S.ok=true;S.score=Math.min(maxStars,S.score+STAR_BONUS);S.lastDelta=STAR_BONUS;
   S.message=encouragement(S.tries?'recovered':'first');
   S.completed.push({mi:S.mi,qi:S.qi,choice:n,result:'correct',tries:S.tries,points:STAR_BONUS,attempts:[...S.attempts],hint:S.usedHint});
 }else{
   S.tries++;S.mistakes++;const lost=Math.min(S.score,STAR_MISTAKE);S.score-=lost;S.questionLoss+=lost;S.lastDelta=-lost;
   if(S.tries>=2){
     S.revealed=true;S.message=encouragement('lost');
     S.completed.push({mi:S.mi,qi:S.qi,choice:null,result:'lost',tries:S.tries,points:-S.questionLoss,attempts:[...S.attempts],hint:S.usedHint});
   }else S.message=encouragement('retry');
 }
 render();
}
function next(){if(!(S.ok||S.revealed))return;const m=missions[S.mi];if(S.qi+1<m.questions.length){S.qi++;S.selected=null;S.tries=0;S.ok=false;S.revealed=false;S.hint=false;S.usedHint=false;S.attempts=[];S.lastDelta=0;S.questionLoss=0;S.mode='play';}else S.mode='clear';render();window.scrollTo({top:0,behavior:'smooth'});}
function nextZone(){if(S.mode!=='clear')return;if(S.mi===5)S.mode='finish';else{S.mi++;S.qi=0;S.selected=null;S.tries=0;S.revealed=false;S.ok=false;S.hint=false;S.usedHint=false;S.attempts=[];S.lastDelta=0;S.questionLoss=0;S.mode='play';}render();window.scrollTo({top:0,behavior:'smooth'});}
function reportText(){const st=formativeSummary(),l=level();const out=[
 'LE DOSSIER IMPOSSIBLE — RAPPORT PERSONNEL',
 `Joueur : ${S.playerName}`,`Niveau dans le jeu : ${l.name}`,`Étoiles : ${S.score}/${maxStars}`,
 `Réponses au premier essai : ${st.first}/${nQuestions}`,`Réponses rattrapées : ${st.recovered}`,`Questions perdues : ${st.revealed}`,`Erreurs : ${st.errors}`,'',
 'CE QUE RÉVÈLENT TES DÉCISIONS',...personalNarrative(),'','PARCOURS PAR MISSION'];
 allStats().forEach(z=>{out.push(`${missions[z.mi].name} : ${z.first}/${z.total} du premier coup ; ${z.recovered} rattrapée(s) ; ${z.revealed} perdue(s).`);});
 out.push('','Niveaux et étoiles : repères propres au jeu, sans valeur certificative.','Le jeu ne transmet pas tes réponses à un serveur.');
 return out.join('\n');}

function reportHTML(){const l=level(),st=formativeSummary(),stats=allStats(),prog=Math.round(100*S.score/maxStars);
 const missionCards=stats.map(z=>`<article class="zone-card"><h3>${esc(missions[z.mi].icon)} ${esc(missions[z.mi].name)}</h3><span class="zone-label">${esc(humanZone(z))}</span><div class="zone-bar"><span style="width:${Math.round(100*z.ratio)}%"></span></div><p>${z.first}/${z.total} du premier coup · ${z.recovered} rattrapée(s) · ${z.revealed} perdue(s)</p></article>`).join('');
 const story=personalNarrative().map(p=>`<p>${esc(p)}</p>`).join('');
 return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilan personnel — ${esc(S.playerName)} — Le dossier impossible</title>
 <style>
 :root{--green:#41bc72;--ink:#254058;--muted:#61798c;--line:#dfeaf0;--sky:#ecf8fe}
 *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 6% 0%,#d9f9dd,transparent 36%),radial-gradient(circle at 96% 20%,#e6e5ff,transparent 40%),#f0f9fb;color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
 .sheet{max-width:960px;margin:26px auto;padding:35px 39px 38px;background:white;border-radius:28px;border:2px solid #dbeaf0;box-shadow:0 18px 55px #355e6b22;overflow:hidden}
 .brand{display:flex;align-items:center;gap:13px;border-bottom:2px solid #e8f0f2;padding-bottom:17px;font-weight:950}.logo{width:52px;height:52px;border-radius:16px;background:#50c980;display:grid;place-items:center;font-size:28px;box-shadow:0 5px 0 #2e9954}.kicker{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;color:#499964;font-weight:950;margin:28px 0 6px}
 h1{font-size:clamp(2rem,4.5vw,3rem);letter-spacing:-.035em;line-height:1.12;margin:8px 0 13px}h1 em{font-style:normal;color:#35b671}h2{font-size:1.38rem;color:#31536a;margin:27px 0 13px}.lead{color:#688096;margin:0 0 24px}
 .rank{display:grid;grid-template-columns:105px 1fr;gap:22px;align-items:center;border:2px solid #c9e9d7;border-radius:23px;background:linear-gradient(110deg,#e9fbed,#f2efff);padding:22px;margin:18px 0 20px}.rank-icon{text-align:center;font-size:4rem}.rank-name{font-size:2rem;font-weight:950;color:#299657;line-height:1.15}.rank small{display:block;font-weight:950;color:#70869b;letter-spacing:.09em}.rank strong{color:#329a61}.bar{height:12px;border-radius:20px;background:#d9e9ef;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#46c873,#b8df53,#ffd16a)}
 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat{border:2px solid #e2edf2;border-radius:19px;background:#f8fcff;padding:18px 13px;text-align:center}.stat strong{display:block;font-size:1.65rem;color:#2fa967}.stat span{font-size:.79rem;color:#657d91;font-weight:750}
 .narrative{border:2px solid #cae9d8;background:#f5fff8;padding:22px 25px;border-radius:20px;margin-top:27px}.narrative h2{margin:0 0 13px}.narrative p{margin:11px 0;color:#39596a}
 .missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.zone-card{background:#f8fbff;border:2px solid #e0eaf2;border-radius:18px;padding:16px}.zone-card h3{margin:0 0 5px;font-size:1rem}.zone-label{color:#339861;font-weight:900;font-size:.84rem}.zone-bar{height:9px;background:#e2ecf1;overflow:hidden;border-radius:20px;margin:10px 0}.zone-bar span{display:block;height:100%;background:#58c97d}.zone-card p{color:#6a8192;font-size:.81rem;margin:0}
 .footer{margin-top:27px;padding:18px;border-radius:17px;background:#f1f8fd;color:#647b8c;font-size:.82rem}.print{border:0;border-radius:13px;background:#53c879;color:white;font-weight:900;padding:12px 17px;box-shadow:0 4px 0 #28964f;cursor:pointer;float:right}.print:focus-visible{outline:3px solid #f2bd45;outline-offset:4px}
 @media(max-width:680px){.sheet{margin:0;padding:19px;border-radius:0}.rank{grid-template-columns:1fr;text-align:center}.stats{grid-template-columns:repeat(2,1fr)}.missions{grid-template-columns:1fr}.print{float:none;display:block;margin-bottom:18px}}
 @media print{body{background:white;print-color-adjust:exact;-webkit-print-color-adjust:exact}.sheet{box-shadow:none;border:0;margin:0;max-width:none;padding:0}.print{display:none}.rank,.stat,.narrative,.zone-card{break-inside:avoid}}
 </style></head><body><main class="sheet"><button class="print" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button><div class="brand"><div class="logo" aria-hidden="true">📁</div><div>LE DOSSIER IMPOSSIBLE<br><small style="font-weight:600;color:#7990a0">Rapport personnel d’enquête</small></div></div><p class="kicker">MISSION ACCOMPLIE · SIX ÉTAPES</p><h1>${esc(S.playerName)}, <em>ton bilan est prêt !</em></h1><p class="lead">Ce rapport est généré à partir de tes décisions au cours du jeu.</p>
 <section class="rank"><div class="rank-icon">${esc(l.icon)}</div><div><small>TON NIVEAU DANS LE JEU</small><div class="rank-name">${esc(l.name)}</div><strong>${S.score} étoiles sur ${maxStars}</strong><div class="bar"><span style="width:${prog}%"></span></div></div></section>
 <section class="stats" aria-label="Résultats chiffrés"><div class="stat"><strong>${st.first}/${nQuestions}</strong><span>Du premier coup</span></div><div class="stat"><strong>${st.recovered}</strong><span>Rattrapées</span></div><div class="stat"><strong>${st.revealed}</strong><span>Perdues</span></div><div class="stat"><strong>${st.errors}</strong><span>Erreurs</span></div><div class="stat"><strong>${st.hints}</strong><span>Indices consultés</span></div><div class="stat"><strong>${S.score} ⭐</strong><span>Solde final</span></div></section>
 <section class="narrative"><h2>📝 Ce que révèlent tes décisions</h2>${story}</section><h2>Ton parcours en six missions</h2><section class="missions">${missionCards}</section>
 <footer class="footer">Les étoiles et les niveaux sont des repères propres à ce jeu et ne constituent pas une évaluation certificative. Ce document a été produit localement dans ton navigateur : le jeu n’a pas transmis ton prénom ni tes réponses à un serveur.</footer></main></body></html>`;
}

function downloadFile(data,type,filename){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function downloadHTML(){downloadFile(reportHTML(),'text/html;charset=utf-8','dossier-impossible_bilan-personnel.html');}

stage.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){pick(Number(choice.dataset.choice));return;}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case 'start':{const field=$('player-start');const name=(field?.value||'').trim().replace(/[\r\n\t]/g,' ').slice(0,24);if(!name){const msg=$('start-error');msg.hidden=false;msg.textContent='Indique un prénom ou un pseudo pour commencer.';field?.focus();break;}S.playerName=name;S.mode='play';render();break;}case 'hint':if(!S.hint)S.usedHint=true;S.hint=!S.hint;render();break;case 'next':next();break;case 'next-zone':nextZone();break;case 'download-html':downloadHTML();break;case 'restart':if(confirm('Recommencer le jeu ? Le parcours actuel sera effacé.')){S=freshState();render();}break;}});
render();
})();
</script>
</body>
