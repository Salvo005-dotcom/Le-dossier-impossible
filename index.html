function cleared(){const m=missions[S.mi];return `<div class="clear"><div class="clear-icon" aria-hidden="true">${esc(m.icon)}</div><p class="eyebrow">ZONE DÉVERROUILLÉE · ${S.mi+1} / 6</p><h2>${esc(m.name)} : terminé !</h2><p class="lead" style="margin-left:auto;margin-right:auto">Tu viens de résoudre ${m.questions.length} situations documentaires. Chaque décision rapproche l’équipe d’un dossier exploitable.</p><div class="reward">✦ ${esc(m.short)} · Sceau récupéré</div><div class="lesson"><strong>À retenir</strong><p>${esc(m.lesson)}</p></div><div class="reflection"><label for="memo">Une règle que tu retiens pour ta pratique professionnelle (facultatif)</label><textarea id="memo" placeholder="Ex. : Je ne considère jamais « final » comme une preuve de validation.">${esc(S.notes[S.mi]||'')}</textarea><p class="micro">Ce message figurera dans ton bilan téléchargeable. Il n'est pas évalué automatiquement.</p></div><div class="actions" style="justify-content:center"><button class="btn" data-action="next-zone">${S.mi===5?'Accéder au bilan final':'Accéder à la zone suivante →'}</button></div></div>`;}
function finish(){let solved=S.completed.filter(x=>x.result==='solution').length;return `<p class="eyebrow">Opération archives · Mission accomplie</p><h1 class="display">Dossier <em>réparé.</em></h1><p class="lead">Tu as examiné les versions, classé les ressources, vérifié leur origine et contrôlé les données avant diffusion. Le dossier est maintenant plus facile à reprendre par une autre personne.</p><div class="reportgrid"><div class="stat"><strong>6 / 6</strong><span>Zones parcourues</span></div><div class="stat"><strong>${S.score} ✦</strong><span>Étoiles récoltées</span></div><div class="stat"><strong>${solved}</strong><span>Solutions consultées après erreur</span></div></div><h2 class="subhead">Les six réflexes à garder</h2><div class="review">${missions.map(m=>`<div class="reviewitem"><strong>${esc(m.icon)} ${esc(m.short)}</strong><p>${esc(m.lesson)}</p></div>`).join('')}</div><div class="mission-frame"><strong>Débriefing</strong><p>Qu’est-ce qui rend un dossier documentaire compréhensible et réutilisable par un collègue six mois plus tard ? Quelle décision as-tu trouvée la plus délicate ?</p></div><details class="mission-frame"><summary style="cursor:pointer;font-weight:900;color:#ffe1aa">✦ Défi bonus — Trois dilemmes pour les enquêteurs expérimentés</summary><p style="margin:15px 0">Discute ces cas avec un collègue avant d’ouvrir les réponses. Plusieurs éléments doivent être pris en compte : il ne s’agit pas de devinettes.</p><details class="lesson"><summary style="cursor:pointer;font-weight:800">Cas A : une version validée contient une information devenue obsolète. Diffuser ou pas ?</summary><p style="margin-top:9px">La validation d'une version est réelle, mais elle ne garantit pas sa pertinence actuelle. Il faut confronter la version à la source actualisée, demander une révision si nécessaire et signaler explicitement le changement.</p></details><details class="lesson"><summary style="cursor:pointer;font-weight:800">Cas B : trois sites reprennent le même chiffre sans le rapport original. Est-ce une confirmation ?</summary><p style="margin-top:9px">Pas nécessairement. Trois reprises d'une même affirmation ne sont pas trois vérifications indépendantes. Il faut remonter au rapport et examiner la méthode de collecte et le contexte.</p></details><details class="lesson"><summary style="cursor:pointer;font-weight:800">Cas C : un tableau contient des identifiants pseudonymisés. Peut-on le publier librement ?</summary><p style="margin-top:9px">La pseudonymisation n'équivaut pas à l'anonymisation. Selon les informations disponibles et les possibilités de réidentification, des personnes peuvent rester identifiables. Le partage doit être évalué au regard de la finalité et des accès nécessaires.</p></details></details><div class="actions"><button class="btn" data-action="download">Télécharger mon journal d'enquête (.txt)</button><button class="btn secondary" data-action="restart">Recommencer</button></div><p class="micro">Ce jeu n’envoie pas les réponses à un serveur. Le journal est généré directement dans ton navigateur.</p>`;}
function render(){status();stage.innerHTML=S.mode==='welcome'?welcome():S.mode==='play'?question():S.mode==='clear'?cleared():finish();}
function pick(n){if(S.mode!=='play'||S.ok||S.revealed)return;const q=missions[S.mi].questions[S.qi];S.selected=n;if(n===q.correct){S.ok=true;const points=S.tries===0?10:S.tries===1?7:4;S.score+=points;S.completed.push({mi:S.mi,qi:S.qi,choice:n,result:'correct',tries:S.tries,points});}else{S.tries++;S.mistakes++;}render();}
function reveal(){if(S.mode!=='play'||S.tries<2)return;const q=missions[S.mi].questions[S.qi];S.revealed=true;S.completed.push({mi:S.mi,qi:S.qi,choice:q.correct,result:'solution',tries:S.tries,points:0});render();}
function next(){if(!(S.ok||S.revealed))return;const m=missions[S.mi];if(S.qi+1<m.questions.length){S.qi++;S.selected=null;S.tries=0;S.ok=false;S.revealed=false;S.hint=false;S.mode='play';}else S.mode='clear';render();window.scrollTo({top:0,behavior:'smooth'});}
function nextZone(){if(S.mode!=='clear')return;if(S.mi===5)S.mode='finish';else{S.mi++;S.qi=0;S.selected=null;S.tries=0;S.revealed=false;S.ok=false;S.hint=false;S.mode='play';}render();window.scrollTo({top:0,behavior:'smooth'});}
function reportText(){let out=['LE DOSSIER IMPOSSIBLE — JOURNAL D’ENQUÊTE','Simulation fictive · Aucune donnée envoyée','',`Étoiles : ${S.score}`,`Décisions : ${S.completed.length}/${nQuestions}`,`Solutions consultées : ${S.completed.filter(x=>x.result==='solution').length}`,''];missions.forEach((m,i)=>{out.push(`MISSION ${i+1} — ${m.name}`);m.questions.forEach((q,j)=>{const log=S.completed.find(a=>a.mi===i&&a.qi===j);const opts=q.opts||m.folderOptions;out.push(`Question : ${q.ask}`,`Réponse de référence : ${opts[q.correct].title}`,`Parcours : ${log?.result==='solution'?'solution consultée':log?'choix validé':'non terminé'}`,`Explication : ${q.why||folderWhy(m,q)}`,'');});out.push(`Ma note : ${S.notes[i]||'—'}`,'');});return out.join('\n');}
function download(){const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='le-dossier-impossible_journal-enquete.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
stage.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){pick(Number(choice.dataset.choice));return;}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case 'start':S.mode='play';render();break;case 'hint':S.hint=!S.hint;render();break;case 'reveal':reveal();break;case 'next':next();break;case 'next-zone':if($('memo'))S.notes[S.mi]=$('memo').value;nextZone();break;case 'download':download();break;case 'restart':if(confirm('Recommencer le jeu ? Le parcours actuel sera effacé.')){S={mode:'welcome',mi:0,qi:0,selected:null,tries:0,revealed:false,ok:false,hint:false,score:0,mistakes:0,completed:[],log:[],notes:{}};render();}break;}});
stage.addEventListener('input',e=>{if(e.target.id==='memo')S.notes[S.mi]=e.target.value;});
render();
})();
</script>
</body>
</html>
