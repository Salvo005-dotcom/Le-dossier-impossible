<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),stage=$('stage');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choices=(...items)=>items.map(a=>typeof a==='string'?{title:a}:a);
const missions=[{"icon":"🗂️","name":"Le bon document, au bon endroit","short":"Retrouver","tag":"Repérer et protéger","scene":"Message de la coordination","brief":"« Nous préparons une réunion avec des collègues. Retrouve les documents utilisables sans exposer des informations qui ne doivent pas circuler. »","lesson":"Un fichier pertinent doit être identifié par sa version, sa provenance, son contenu et les personnes autorisées à y accéder.","questions":[{"ask":"Quel document transmettre aux enseignants pour préparer leur atelier ?","context":"Quatre fichiers concernent le même atelier. La consigne exige un document approuvé, modifiable, ne contenant aucune appréciation nominative.","opts":[{"title":"Atelier_v04_BROUILLON.docx — récent, modifiable, sans noms"},{"title":"Atelier_v03_VALIDE.docx — approuvé, modifiable, sans noms"},{"title":"Atelier_v03_VALIDE_notes_eleves.docx — approuvé, modifiable, avec noms"},{"title":"Atelier_v03_VALIDE.pdf — approuvé, sans noms, non prévu pour modification"}],"correct":1,"hint":"Vérifie simultanément les trois contraintes : statut, modification possible et confidentialité.","why":"La version v03 validée au format DOCX est la seule qui respecte les trois conditions. La version avec notes nominatives a le bon statut, mais elle expose des données inutiles aux destinataires."},{"ask":"Quel fichier utiliser pour publier un chiffre global de participation ?","context":"La direction veut présenter un indicateur par niveau, sans communiquer les inscriptions individuelles. Une extraction de synthèse a déjà été contrôlée.","opts":[{"title":"Inscriptions_BRUT.csv — liste nominative récente"},{"title":"Inscriptions_SYNTHESE_v01.csv — données groupées, mais non vérifiées"},{"title":"Inscriptions_SYNTHESE_v02_CONTROLE.csv — effectifs groupés et contrôlés"},{"title":"Inscriptions_SYNTHESE_v03_BROUILLON.csv — synthèse plus récente non contrôlée"}],"correct":2,"hint":"Une date récente ne remplace pas un contrôle. La publication ne nécessite aucune identité.","why":"La synthèse v02 contrôlée répond au besoin et évite la diffusion des lignes nominatives. La v03 est plus récente, mais n’a pas encore été vérifiée."},{"ask":"Quelle ressource conserver comme référence vérifiable ?","context":"Une infographie circule dans le groupe de travail. Le dossier doit permettre d’en retrouver l’origine et de vérifier ses chiffres.","opts":[{"title":"Une capture de l’infographie mentionnant un compte sur un réseau social"},{"title":"Un résumé de l’infographie rédigé par un assistant IA"},{"title":"Un article reprenant l’infographie, sans renvoi à l’étude"},{"title":"Le rapport source daté, avec auteur, méthode et URL stable"}],"correct":3,"hint":"La source de référence doit permettre de contrôler comment les chiffres ont été produits.","why":"Le rapport original donne accès aux données, à la méthode et à la provenance. Un article secondaire peut aider à trouver la piste, sans remplacer la source primaire."},{"ask":"Un dossier intitulé « Supports publics » contient une liste de prénoms d’élèves. Que faire avant le partage ?","context":"Les supports pédagogiques doivent être accessibles aux participants, mais la liste des élèves n’est pas nécessaire à cette utilisation.","opts":[{"title":"Partager tout le dossier : son titre indique qu’il est public"},{"title":"Créer une copie de diffusion contenant uniquement les supports nécessaires, puis vérifier les droits d’accès"},{"title":"Renommer la liste « interne » et partager tout le dossier en lecture seule"},{"title":"Partager tout le dossier avec un lien non indexé par les moteurs de recherche"}],"correct":1,"hint":"Le nom du dossier, le mode lecture seule ou l’absence d’indexation ne limitent pas à eux seuls les destinataires.","why":"Une copie de diffusion minimisée sépare les supports utiles des informations sur les élèves. Les droits d’accès doivent ensuite correspondre aux destinataires réellement concernés."}]},{"icon":"🧩","name":"Versions sous contrôle","short":"Versions","tag":"Statut et confidentialité","scene":"Alerte du secrétariat","brief":"« Plusieurs versions semblent définitives. Certaines contiennent des informations réservées au personnel habilité. Décide laquelle utiliser et comment conserver les précédentes. »","lesson":"Un numéro de version, une approbation et un public destinataire sont trois informations différentes. La diffusion doit tenir compte des trois.","questions":[{"ask":"Quelle version envoyer aux participants de la journée pédagogique ?","context":"Il faut le programme approuvé, sans liste interne des enseignants ni commentaires préparatoires.","opts":[{"title":"Programme_v05_PREVALIDATION.pdf — contenu public, validation en attente"},{"title":"Programme_v04_VALIDE_INTERNE.pdf — approuvé, mais comporte les commentaires internes"},{"title":"Programme_v04_VALIDE_DIFFUSION.pdf — approuvé, contenu limité au programme public"},{"title":"Programme_v06_BROUILLON_DIFFUSION.pdf — contenu public, plus récent"}],"correct":2,"hint":"Le numéro le plus élevé n’est pas le critère décisif. Regarde l’approbation et le destinataire.","why":"La variante v04 approuvée pour diffusion a le bon statut et le bon contenu. La variante interne est également validée, mais elle contient des informations qui n’ont pas à être partagées."},{"ask":"Quel fichier constitue la référence actuelle pour un bilan ?","context":"La v03, validée mardi, corrige une erreur de calcul de la v02 validée lundi. La v04, créée mercredi, est un brouillon non contrôlé.","opts":[{"title":"v04_BROUILLON — la date la plus récente prévaut"},{"title":"v02_VALIDE — le premier fichier approuvé reste la référence"},{"title":"v03_VALIDE — dernière version corrigée et approuvée"},{"title":"v03_VALIDE et v04_BROUILLON — les deux sont équivalents"}],"correct":2,"hint":"Une révision non approuvée n’annule pas automatiquement une version validée.","why":"La v03 est la dernière version dont les corrections ont été contrôlées. La v04 peut servir au travail, mais ne doit pas être présentée comme un résultat validé."},{"ask":"Comment conserver une ancienne version d’un document de suivi contenant des informations personnelles ?","context":"La v02 est remplacée par v03. La durée de conservation et les règles d’archivage sont fixées par l’établissement et doivent être vérifiées.","opts":[{"title":"Garder v02 dans le dossier actif, à côté de v03, sans distinction"},{"title":"Archiver v02 avec statut « remplacée », accès restreint et durée conforme à la règle applicable"},{"title":"Supprimer immédiatement v02 : le remplacement impose toujours l’effacement"},{"title":"Mettre v02 dans une archive accessible par lien public pour garantir la traçabilité"}],"correct":1,"hint":"Conserver n’implique pas conserver indéfiniment ni donner accès à tous.","why":"L’archivage restreint, documenté et conforme à la durée applicable préserve la traçabilité sans maintenir une version obsolète en circulation. L’effacement automatique n’est pas justifiable sans examiner les règles de conservation."},{"ask":"Comment protéger l’accès à un espace contenant des évaluations individuelles ?","context":"L’établissement permet des comptes nominatifs, des permissions ciblées et l’authentification multifacteur.","opts":[{"title":"Comptes individuels habilités, mot de passe robuste et unique, et authentification multifacteur"},{"title":"Compte commun à l’équipe, mot de passe robuste et unique, et authentification multifacteur"},{"title":"Comptes individuels habilités et mot de passe robuste, sans activer le second facteur disponible"},{"title":"Compte commun à l’équipe, protégé par un mot de passe changé chaque mois"}],"correct":0,"hint":"Le mot de passe n’est qu’une partie du contrôle : les personnes doivent aussi être identifiables individuellement.","why":"La combinaison de comptes individuels, de permissions adaptées, d’un mot de passe robuste et d’un second facteur réduit le risque d’accès indu. Un compte partagé empêche notamment de rattacher clairement une action à son utilisateur."}]},{"icon":"📁","name":"Le labyrinthe des accès","short":"Classer","tag":"Ranger et autoriser","scene":"Intervention de l’équipe informatique","brief":"« L’espace partagé contient des documents de travail, des ressources publiques et des données réservées. Pour chaque fichier, choisis l’emplacement et les accès adaptés. »","lesson":"Le bon classement dépend de l’usage réel, du statut et de la sensibilité du document. Un dossier bien nommé n’est pas forcément un dossier sécurisé.","questions":[{"ask":"Où ranger le compte rendu d’un conseil comprenant des appréciations nominatives ?","context":"Le document est approuvé. Il est destiné exclusivement aux professionnels habilités au suivi des élèves.","opts":[{"title":"Validés / accès à tous les enseignants de l’établissement"},{"title":"Suivi des élèves / accès restreint aux personnes habilitées"},{"title":"Archives publiques / lecture seule pour tout détenteur du lien"},{"title":"Travail personnel / synchronisation sur un cloud privé"}],"correct":1,"hint":"Le statut « validé » ne rend pas le document accessible à l’ensemble du personnel.","why":"La destination « suivi des élèves » et le contrôle des accès correspondent à l’usage réel. Le rangement dans un dossier « Validés » trop largement partagé exposerait des informations personnelles."},{"ask":"Comment ranger un export brut de comptages, avant toute correction ?","context":"Le fichier ne contient aucune donnée personnelle. Il servira de référence pour vérifier les traitements ultérieurs.","opts":[{"title":"Sources / original conservé en lecture seule, avec copie distincte pour travailler"},{"title":"Travail / original modifié directement, avec une copie dans les téléchargements"},{"title":"Archives / original rangé avec des versions obsolètes, sans index"},{"title":"Validés / original présenté comme une analyse déjà contrôlée"}],"correct":0,"hint":"Un export brut doit rester disponible pour retrouver l’état initial des données.","why":"Séparer une source originale non modifiée de sa copie de travail préserve la traçabilité. Modifier la source directement empêche de contrôler les transformations."},{"ask":"Où placer une photographie destinée à une affiche lorsque l’autorisation de publication n’est pas établie ?","context":"L’auteur du cliché est connu, mais les droits des personnes photographiées restent à examiner.","opts":[{"title":"Diffusion / accès public, avec crédit du photographe"},{"title":"Sources / accès public, puisque la photo est authentique"},{"title":"À vérifier / accès limité, le temps de contrôler les autorisations nécessaires"},{"title":"Validés / accès interne, puis publier sans autre contrôle"}],"correct":2,"hint":"Le crédit de l’auteur et les droits des personnes représentées sont deux vérifications distinctes.","why":"Le document doit rester dans un espace de vérification à accès limité tant que les conditions de diffusion ne sont pas établies. Le fait que le photographe soit identifié ne règle pas les droits à l’image."},{"ask":"Quelle organisation adopter pour un tableau de bord mis à jour chaque mois ?","context":"Le tableau de bord destiné aux collègues présente des indicateurs agrégés. Il est dérivé d’un fichier source réservé aux personnes habilitées.","opts":[{"title":"Un seul dossier partagé contenant la source détaillée et le tableau de bord"},{"title":"Un dossier « Diffusion » contenant aussi la source détaillée, mais cachée"},{"title":"Deux espaces : source restreinte et tableau agrégé contrôlé accessible aux destinataires"},{"title":"Un dossier personnel contenant les deux fichiers, partagé par lien à tous"}],"correct":2,"hint":"Les droits de consultation ne doivent pas être hérités automatiquement du dossier contenant les détails.","why":"Dissocier la source détaillée du résultat agrégé permet de rendre les indicateurs utiles sans exposer les lignes individuelles. Les deux espaces n’ont pas les mêmes destinataires."},{"ask":"Comment traiter une liste de participants utilisant des codes à la place des noms ?","context":"Un autre fichier détenu par l’équipe permet de retrouver l’identité correspondant à chaque code.","opts":[{"title":"Considérer la liste comme anonyme et la rendre publique"},{"title":"Conserver la correspondance séparément et limiter les accès aux deux fichiers"},{"title":"Mettre la correspondance dans le même dossier partagé pour faciliter le travail"},{"title":"Remplacer les codes par des initiales avant publication"}],"correct":1,"hint":"Les codes ne rendent pas les personnes anonymes si une correspondance permet de les réidentifier.","why":"La liste est pseudonymisée, pas nécessairement anonymisée. Il faut protéger la table de correspondance, limiter les accès et vérifier si la diffusion est justifiée."},{"ask":"Où placer une ancienne fiche approuvée contenant les coordonnées privées d’intervenants ?","context":"Elle a été remplacée ; aucune règle de conservation ne t’a encore été communiquée.","opts":[{"title":"Archives publiques / elle a déjà été utilisée, donc elle est diffusable"},{"title":"Archives restreintes / statut « remplacée », durée de conservation à vérifier"},{"title":"Validés / accès à tous, pour éviter toute perte"},{"title":"Corbeille définitive / effacement immédiat sans examen"}],"correct":1,"hint":"La version est obsolète, mais la conservation doit suivre une règle et rester proportionnée.","why":"L’archivage restreint permet d’éviter sa réutilisation et d’examiner la durée de conservation applicable. Il ne faut ni partager des coordonnées privées ni détruire automatiquement une pièce sans vérifier ses obligations."},{"ask":"Quelle structure préparer pour permettre à des collègues de consulter une analyse de résultats ?","context":"Les lignes sources permettent d’identifier des élèves. Les collègues destinataires n’ont besoin que de statistiques par niveau.","opts":[{"title":"Source détaillée restreinte + synthèse agrégée contrôlée dans l’espace de diffusion"},{"title":"Source détaillée et synthèse dans le même dossier, avec accès en lecture seule"},{"title":"Synthèse agrégée dans un dossier public, en laissant les identifiants masqués dans les lignes"},{"title":"Source détaillée sur un cloud personnel, synthèse dans l’espace institutionnel"}],"correct":0,"hint":"Le mode lecture seule ne règle pas la confidentialité : il empêche de modifier, pas de lire.","why":"Le partage de statistiques contrôlées, sans accès aux lignes individuelles, correspond au besoin. Le fichier source doit rester dans un espace à accès restreint."},{"ask":"Où conserver un brouillon d’analyse produit avec un outil d’IA, en attente de vérification ?","context":"Le texte n’a pas été contrôlé et l’équipe veut éviter qu’il soit pris pour une version approuvée.","opts":[{"title":"Validés / mention « généré par IA » dans le nom"},{"title":"Archives / sans indication de son état de vérification"},{"title":"Travail / étiquette « à vérifier », accès limité et sources à contrôler"},{"title":"Diffusion / pour solliciter tous les destinataires avant vérification"}],"correct":2,"hint":"Une production IA lisible n’est pas nécessairement une production contrôlée.","why":"Un espace de travail à accès limité et une indication explicite du statut empêchent de confondre brouillon et document approuvé. Les sources et les affirmations devront être vérifiées avant diffusion."}]},{"icon":"🔎","name":"Les preuves et leurs limites","short":"Tracer","tag":"Sources et droits","scene":"Message du documentaliste","brief":"« Les ressources retenues doivent être vérifiables et réutilisables. Certaines contiennent des informations sensibles ou des droits à clarifier. »","lesson":"Réutiliser une ressource suppose d’en connaître l’origine, le statut et les éventuelles restrictions. Pour une image, l’attribution et l’autorisation de publication ne se confondent pas.","questions":[{"ask":"Quelles informations noter pour documenter une ressource susceptible d’évoluer ?","context":"Un portail institutionnel actualise régulièrement un fichier téléchargeable.","opts":[{"title":"Le titre et la date du téléchargement uniquement"},{"title":"Le titre, l’URL et le nom du collègue qui l’a transmis"},{"title":"L’auteur ou organisme, l’URL, la date de consultation et la version ou date du document"},{"title":"Le titre, la date du téléchargement et une capture d’écran sans URL"}],"correct":2,"hint":"Il faut pouvoir retrouver le document et distinguer la version utilisée d’une version ultérieure.","why":"La provenance, la date de consultation et la version permettent à un collègue de reproduire la recherche et de comprendre un éventuel changement de contenu."},{"ask":"Comment intégrer une photographie trouvée sur Internet dans une publication de l’établissement ?","context":"L’auteur et le fichier d’origine sont identifiés, mais la licence de réutilisation et les droits des personnes photographiées sont inconnus.","opts":[{"title":"Créditer l’auteur : cela suffit pour publier"},{"title":"Vérifier les droits de réutilisation et ceux des personnes représentées avant diffusion"},{"title":"Utiliser une petite image : elle échappe automatiquement aux restrictions"},{"title":"Recadrer l’image et citer la page où elle a été trouvée"}],"correct":1,"hint":"La mention de la source n’accorde pas automatiquement une autorisation de publication.","why":"Les droits sur la photographie et ceux des personnes représentées peuvent être distincts. Leur vérification dépend de l’usage envisagé et du contexte ; citer l’auteur ne suffit pas à lui seul."},{"ask":"Comment utiliser une IA pour résumer une note interne contenant des données sur des élèves ?","context":"L’outil externe n’a pas été approuvé par l’établissement et aucune information sur le traitement des données transmises n’est disponible.","opts":[{"title":"Envoyer la note et supprimer ensuite la conversation"},{"title":"Remplacer les noms par des initiales et transmettre le reste de la note"},{"title":"Ne pas envoyer la note ; produire un extrait non per fectifs globaux ?","context":"Les lignes uniques validées totalisent 12 + 15 + 18 + 0 + 17 = 62 ; l’effectif de 2B reste inconnu. La source détaillée reste dans un espace restreint.","opts":[{"title":"62 inscriptions confirmées sur les groupes renseignés, avec la réserve « 2B non confirmé »"},{"title":"62 inscriptions au total pour tous les groupes, sans réserve"},{"title":"62 inscriptions confirmées, accompagnées du fichier source détaillé"},{"title":"79 inscriptions estimées, en attribuant 17 au groupe 2B"}],"correct":0,"hint":"Une synthèse destinée à des collègues n’exige pas de transmettre toutes les lignes sources.","why":"Le total de 62 est vérifiable, mais partiel. La réserve sur 2B doit l’accompagner, et la source détaillée ne doit être partagée que si les destinataires en ont réellement besoin et sont autorisés."}]},{"icon":"🚀","name":"Livrer sans mauvaise surprise","short":"Livrer","tag":"Partager et sécuriser","scene":"Dernier message de la direction","brief":"« Les documents sont classés et les chiffres contrôlés. Avant d’ouvrir l’espace aux collègues, vérifie les accès, les sauvegardes, les incidents et les usages de l’IA. »","lesson":"Un dossier vraiment réutilisable est documenté, mais aussi protégé : droits d’accès ciblés, sauvegardes adaptées, gestion rapide des incidents et usage maîtrisé des outils numériques.","questions":[{"ask":"Quelle configuration choisir pour partager le dossier de suivi avec les seuls collègues autorisés ?","context":"Les personnes concernées doivent consulter les documents sans les modifier. L’espace contient des informations personnelles.","opts":[{"title":"Lien « toute personne possédant le lien » en lecture seule"},{"title":"Accès nominatif réservé aux collègues habilités, en lecture seule"},{"title":"Accès à tous les comptes de l’école, avec protection par mot de passe dans le fichier"},{"title":"Dossier public, mais masqué dans le menu de l’espace partagé"}],"correct":1,"hint":"La lecture seule empêche de modifier, mais pas de consulter ou recopier.","why":"L’accès nominatif limité aux personnes habilitées associe un périmètre clair à des permissions adaptées. Un lien ouvert à tout détenteur reste trop large."},{"ask":"Quelle stratégie de sauvegarde convient à un dossier professionnel sensible ?","context":"Le dossier est modifié chaque semaine. L’établissement dispose d’une solution institutionnelle de sauvegarde et de restauration.","opts":[{"title":"Copier occasionnellement les fichiers sur un ordinateur personnel"},{"title":"Activer la sauvegarde institutionnelle et vérifier périodiquement la restauration"},{"title":"Synchroniser le dossier en temps réel et considérer cela comme une sauvegarde suffisante"},{"title":"Conserver le dossier sur deux clouds personnels au cas où l’un tombe en panne"}],"correct":1,"hint":"La synchronisation peut propager une suppression ou une erreur : ce n’est pas automatiquement une sauvegarde récupérable.","why":"Une solution institutionnelle adaptée, avec possibilité de restauration vérifiée, protège mieux la disponibilité et la confidentialité des données."},{"ask":"Tu constates qu’un fichier nominatif a été partagé par erreur via un lien public. Quelle réaction est appropriée ?","context":"L’accès était ouvert pendant une période inconnue ; l’établissement dispose d’une procédure de signalement des incidents.","opts":[{"title":"Supprimer le fichier, sans signaler l’incident puisqu’il n’est plus accessible"},{"title":"Révoquer l’accès, conserver les éléments utiles et signaler rapidement l’incident selon la procédure"},{"title":"Renommer le fichier et considérer que le lien public ne fonctionne plus"},{"title":"Avertir toute l’équipe par un message contenant une copie du fichier pour vérifier qui l’a vu"}],"correct":1,"hint":"Une suppression ne permet pas de savoir si le fichier a été consulté ou copié.","why":"Il faut limiter immédiatement l’exposition et faire traiter l’incident par les personnes compétentes, notamment pour évaluer les suites à donner. La procédure interne constitue le bon point d’entrée."},{"ask":"Un collègue veut utiliser une IA externe pour résumer des appréciations nominatives sur des élèves. Que recommander ?","context":"Le service n’a pas été autorisé pour ce traitement et sa politique d’utilisation des données n’a pas été examinée.","opts":[{"title":"Transmettre les appréciations après suppression des seuls noms de famille"},{"title":"Transmettre le texte dans un onglet de navigation privée"},{"title":"Ne pas transmettre ces données ; privilégier un extrait réellement non personnel ou un outil approuvé selon le cadre applicable"},{"title":"Envoyer le document, puis demander à l’IA de ne pas le mémoriser"}],"correct":2,"hint":"Un pseudonyme ou une consigne adressée à l’IA ne suffit pas à sécuriser le traitement.","why":"Il ne faut pas transmettre des appréciations identifiables à un service dont l’usage n’est pas autorisé ou documenté. Une alternative peut être un texte non personnel ou un outil institutionnel adapté, avec vérification humaine des résultats."}]}];

function encouragement(type){const pool=CHEERS[type]||CHEERS.first;const name=S.playerName||'enquêteur';
  let possibilities=pool.map(x=>x.replaceAll('{nom}',name)).filter(x=>x!==S.lastMessage);
  if(!possibilities.length) possibilities=pool.map(x=>x.replaceAll('{nom}',name));
  const chosen=possibilities[Math.floor(Math.random()*possibilities.length)];S.lastMessage=chosen;return chosen;
}
function freshState(){return {mode:'welcome',mi:0,qi:0,selected:null,tries:0,revealed:false,ok:false,hint:false,usedHint:false,score:INITIAL_STARS,mistakes:0,completed:[],notes:{},attempts:[],lastDelta:0,questionLoss:0,playerName:'',message:'',lastMessage:''};}

const RANKS=[

function levelScale(){return [...RANKS].map((r,i)=>`${r.min}–${i===0?maxStars:RANKS[i-1].min-1} : ${r.name}`).join(' · ');}
function zoneStats(i){const m=missions[i],logs=S.completed.filter(x=>x.mi===i);return {
  mi:i,total:m.questions.length,first:logs.filter(x=>x.result==='correct'&&x.tries===0).length,
  recovered:logs.filter(x=>x.result==='correct'&&x.tries>0).length,
  revealed:logs.filter(x=>x.result==='lost').length,
  wrong:logs.reduce((a,x)=>a+x.tries,0),hints:logs.filter(x=>x.hint).length,
  ratio:logs.filter(x=>x.result==='correct'&&x.tries===0).length/m.questions.length
};}
function allStats(){return missions.map((_,i)=>zoneStats(i));}
function humanZone(s){return s.ratio>=.75&&s.revealed===0?'Point fort':s.ratio>=.5&&s.revealed===0?'À stabiliser':'À consolider';}
function priorities(){return allStats().filter(z=>z.first<z.total).sort((a,b)=>a.ratio-b.ratio||b.revealed-a.revealed||b.wrong-a.wrong);}
function formativeSummary(){const stats=allStats();return {
  first:stats.reduce((a,z)=>a+z.first,0),recovered:stats.reduce((a,z)=>a+z.recovered,0),
  revealed:stats.reduce((a,z)=>a+z.revealed,0),errors:stats.reduce((a,z)=>a+z.wrong,0),
  hints:stats.reduce((a,z)=>a+z.hints,0)};}
function spotlightQuestions(limit=3){return S.completed.filter(x=>x.tries>0||x.result==='lost').sort((a,b)=>b.tries-a.tries||b.hint-a.hint).slice(0,limit);}
function decisionDescription(log){const m=missions[log.mi],q=m.questions[log.qi],opts=q.opts||m.folderOptions;return {

function dataTable(){return `<div class="table-shell"><table class="data-table"><thead><tr><th>Ligne</th><th>ID</th><th>Groupe</th><th>Effectif</th><th>Statut</th></tr></thead><tbody>${dataRows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">Jeu de données fictif. Une copie de ligne n’est pas une inscription supplémentaire.</p>`;}
function question(){
 const m=missions[S.mi],q=m.questions[S.qi],options=q.opts||m.folderOptions;
 const opts=options.map((o,i)=>{const priorWrong=S.attempts.includes(i)&&i!==q.correct;
  const cls=[m.folders?'foldermode':'',priorWrong?'tried':'',S.selected===i?(S.ok?'good':'bad'):'',S.revealed&&i===q.correct?'good':''].join(' ');
  return `<button class="option ${cls}" data-choice="${i}" ${S.ok||S.revealed||priorWrong?'disabled':''}><span class="key">${m.folders?esc(o.symbol):String.fromCharCode(65+i)}</span><span><span class="opt-title">${esc(o.title)}</span>${o.desc?`<span class="opt-desc">${esc(o.desc)}</span>`:''}</span></button>`;
 }).join('');
 const feedback=S.ok||S.revealed?`<div class="feedback ${S.ok?'good':'note'}" role="status"><p class="cheer">${esc(S.message)}</p><span class="delta ${S.ok?'':'negative'}">${S.ok?`+${STAR_BONUS} étoiles`:`Deux mauvaises réponses, ${S.questionLoss} étoile${S.questionLoss>1?'s':''} perdue${S.questionLoss>1?'s':''}`}</span><strong>Pourquoi cette réponse est-elle correcte ?</strong><p><b>Réponse : ${esc(options[q.correct].title)}.</b> ${esc(q.why||folderWhy(m,q))}</p></div>`
  :S.tries===1?`<div class="feedback bad" role="status"><p class="cheer">${esc(S.message)}</p><p>−${Math.abs(S.lastDelta)} étoiles. Il reste <strong>une seule tentative</strong>. Tu ne peux pas sélectionner de nouveau une réponse déjà essayée.</p></div>`:'';
 return `<div class="quest-head"><div><p class="level">Mission ${S.mi+1} / 6 · ${esc(m.tag)}</p><h2 class="subhead">${esc(m.icon)} ${esc(m.name)}</h2></div><div class="mini-progress" role="progressbar" aria-label="Progression de la mission" aria-valuemin="0" aria-valuemax="${m.questions.length}" aria-valuenow="${S.qi}"><div style="width:${Math.round(100*S.qi/m.questions.length)}%"></div></div></div>
 <div class="scene"><div class="avatar" aria-hidden="true">${esc(m.icon)}</div><div><strong>${esc(m.scene)}</strong><p>${esc(m.brief)}</p></div></div>
 <div class="questionboard"><div class="qb-top"><strong>Question ${S.qi+1} sur ${m.questions.length}</strong><span class="trialchip">${S.ok?'Réponse validée':S.revealed?'Question perdue':S.tries===1?'Un dernier essai':'Deux essais possibles'}</span></div>
 <div class="qb-body"><p class="prompt">${esc(q.ask)}</p>${q.context?`<div class="context"><strong>Information disponible :</strong> ${esc(q.context)}</div>`:''}${m.table?dataTable():''}
 <div class="instruction">🎯 ${m.folders?'Choisis le bon dossier':'Choisis la réponse la plus juste'}</div><div class="options ${m.folders?'foldermode':''}">${opts}</div>
 ${S.hint?`<div class="hintbox"><strong>Indice :</strong> ${esc(q.hint||'Classe le fichier selon son usage actuel et non simplement selon son extension.')}</div>`:''}
 ${feedback}
 <div class="helper"><div class="left">${!S.ok&&!S.revealed?`<button class="btn secondary small" data-action="hint">${S.hint?'Masquer l’indice':'💡 Voir un indice'}</button>`:`<button class="btn" data-action="next">${S.qi===m.questions.length-1?'Terminer cette mission':'Question suivante →'}</button>`}</div><span class="note">${S.tries===1?'Dernier essai pour cette question.':'La correction est affichée après une bonne réponse ou deux erreurs.'}</span></div>
 </div></div>`;
}
function folderWhy(m,q){return `Ce fichier appartient à « ${(q.opts||m.folderOptions)[q.correct].title} » : ${q.context}`;}
const MISSION_ENDINGS=[{"strong":"Première mission accomplie, {nom} ! Tu as retrouvé les bons documents sans négliger les informations à protéger.","mixed":"Première mission terminée, {nom} ! Certaines pistes t’ont résisté : tu connais maintenant les vérifications qui évitent un partage maladroit."},{"strong":"Deuxième mission bouclée, {nom} ! Tu distingues les versions validées des copies qu’il faut garder à l’écart.","mixed":"Deuxième mission achevée, {nom} ! Les versions et les destinataires demandaient parfois une double vérification."},{"strong":"Troisième mission réussie, {nom} ! Tu as remis de l’ordre dans les fichiers tout en maîtrisant les accès.","mixed":"Troisième mission terminée, {nom} ! Les emplacements et les autorisations semblaient parfois proches : les corrections éclairent les différences."},{"strong":"Quatrième mission validée, {nom} ! Tu as retrouvé les sources et identifié les précautions nécessaires à leur réutilisation.","mixed":"Quatrième mission achevée, {nom} ! Tu sais maintenant qu’une source retrouvée n’est pas toujours une ressource librement diffusable."},{"strong":"Cinquième mission accomplie, {nom} ! Tes chiffres restent justifiables et les données détaillées restent protégées.","mixed":"Cinquième mission terminée, {nom} ! Les données étaient piégées : les limites du total et celles du partage sont plus claires."},{"strong":"Sixième mission accomplie, {nom} ! Tu as sécurisé la diffusion du dossier sans sacrifier sa réutilisation.","mixed":"Sixième mission achevée, {nom} ! Tu as terminé l’enquête : découvrons ton bilan personnel."}];
function missionEnding(index,z){const a=MISSION_ENDINGS[index];return (z.revealed===0&&z.first>=Math.ceil(z.total*.75)?a.strong:a.mixed).replaceAll('{nom}',S.playerName);}
function cleared(){const m=missions[S.mi],z=zoneStats(S.mi);return `<div class="clear"><div class="clear-icon" aria-hidden="true">${esc(m.icon)}</div><p class="eyebrow">ÉTAPE TERMINÉE · ${S.mi+1} / 6</p><h2>${esc(missionEnding(S.mi,z))}</h2><p class="lead" style="margin-left:auto;margin-right:auto">${z.first} bonne(s) réponse(s) du premier coup sur ${z.total} · ${z.recovered} rattrapée(s) · ${z.revealed} question(s) perdue(s).</p><div class="reward">✦ ${esc(m.short)} · Étape franchie</div><div class="lesson"><strong>À retenir</strong><p>${esc(m.lesson)}</p></div><div class="actions" style="justify-content:center"><button class="btn" data-action="next-zone">${S.mi===5?'Voir mon bilan personnel':'Continuer l’enquête →'}</button></div></div>`;}

function personalNarrative(){
 const stats=allStats(),total=formativeSummary(),rank=level();
 const merits=z=>(z.first+z.recovered*.55-z.revealed*.45)/z.total;
 const best=[...stats].sort((a,b)=>merits(b)-merits(a)||a.mi-b.mi)[0];
 const weak=[...stats].sort((a,b)=>merits(a)-merits(b)||b.revealed-a.revealed||a.mi-b.mi)[0];
 const bestName=missions[best.mi].name.toLowerCase();
 const weakName=missions[weak.mi].name.toLowerCase();
 let a;
 if(total.first===nQuestions){a=`${S.playerName}, tu as répondu correctement du premier coup aux ${nQuestions} décisions du jeu, sans aucune erreur. C’est un parcours particulièrement régulier.`;}
 else if(total.revealed===0){a=`${S.playerName}, tu as mené toute l’enquête sans perdre de question. Tu as réussi ${total.first} décisions du premier coup et corrigé ${total.recovered} choix après une première erreur.`;}
 else if(total.first>=Math.ceil(nQuestions*.7)){a=`${S.playerName}, ton parcours montre une bonne précision : ${total.first} décisions justes au premier essai sur ${nQuestions}. Tu as aussi su te reprendre ${total.recovered} fois, même si ${total.revealed} question(s) ont été perdues.`;}
 else{a=`${S.playerName}, tu as terminé les six missions et tu disposes maintenant d’un retour précis sur tes décisions. Sur ${nQuestions} situations, ${total.first} ont été résolues du premier coup, ${total.recovered} après une première erreur, et ${total.revealed} ont été perdues.`;}
 let b;
 if(best.first+best.recovered===0){b='Dans ce parcours, aucune question n’a encore été résolue en deux essais. Les corrections indiquent les critères utiles pour distinguer les réponses et pourront servir de repères lors d’une nouvelle partie.';}
 else if(merits(best)>=.75){b=`Ton point fort le plus net est « ${bestName} » : ${best.first} bonne(s) réponse(s) du premier coup sur ${best.total}, ${best.recovered} rattrapée(s) et ${best.revealed} perdue(s). Tes choix sont particulièrement réguliers dans cette mission.`;}
 else{b=`Tes meilleurs résultats relatifs apparaissent dans « ${bestName} » : ${best.first} réponse(s) du premier coup sur ${best.total}, ${best.recovered} rattrapée(s) et ${best.revealed} perdue(s). C’est un point d’appui, même si plusieurs décisions ont encore demandé des ajustements.`;}
 let c;
 if(total.first===nQuestions){c='Aucun point faible n’apparaît dans tes réponses. La prochaine étape consiste simplement à transférer cette rigueur dans un environnement documentaire réel, avec ses cas particuliers.';}
 else if(weak.mi===best.mi){c=`Les résultats sont relativement homogènes entre les missions. Pour gagner en précision, examine le statut réel des documents, leur historique et leur provenance plutôt que les indices de surface. Ce bilan reflète seulement tes réponses dans le jeu.`;}
 else{c=`La principale marge de progression concerne « ${weakName} » : ${weak.revealed} question(s) perdue(s) et ${weak.wrong} erreur(s) au total. ${missions[weak.mi].lesson} Ce bilan décrit ton parcours dans le jeu ; il ne constitue pas un jugement sur tes compétences professionnelles.`;}
 return [a,b,c];
}
function narrativeHTML(){return `<section class="personal-story" aria-label="Bilan personnalisé"><div class="story-heading"><span class="story-icon" aria-hidden="true">📝</span><div><p class="eyebrow">COMPTE RENDU PERSONNEL</p><h2>Ce que révèlent tes décisions</h2></div></div>${personalNarrative().map(p=>`<p>${esc(p)}</p>`).join('')}</section>`;}

function finish(){const l=level(),st=formativeSummary();
 return `<p class="eyebrow">FIN DE L’ENQUÊTE · RAPPORT DE MISSION</p><div class="final-banner"><div class="final-badge" aria-hidden="true">🏆</div><div><h1 class="display">Mission terminée, <em>${esc(S.playerName)} !</em></h1><p class="lead">Le dossier a été examiné jusqu’au bout. Découvre ton niveau et ton rapport personnel d’enquête.</p></div></div>
 <section class="rankpanel" aria-label="Niveau atteint"><div class="rankicon" aria-hidden="true">${l.icon}</div><div><div class="eyebrow" style="margin:0">TON NIVEAU DANS LE JEU</div><div class="rankname">${esc(l.name)}</div><div><strong>${S.score} étoiles</strong> sur ${maxStars} possibles</div><div class="rankstrip" role="progressbar" aria-label="Étoiles obtenues" aria-valuemin="0" aria-valuemax="${maxStars}" aria-valuenow="${S.score}"><div style="width:${Math.round(100*S.score/maxStars)}%"></div></div><p class="ranknote">${esc(l.message)}</p></div></section>
 <div class="reportgrid"><div class="stat"><strong>${st.first} / ${nQuestions}</strong><span>Bonnes réponses du premier coup</span></div><div class="stat"><strong>${st.recovered}</strong><span>Réponses rattrapées</span></div><div class="stat"><strong>${st.revealed}</strong><span>Questions perdues</span></div><div class="stat"><strong>${st.errors}</strong><span>Erreurs commises</span></div><div class="stat"><strong>${st.hints}</strong><span>Indices consultés</span></div><div class="stat"><strong>${S.score} ⭐</strong><span>Étoiles finales</span></div></div>
 ${narrativeHTML()}
 <h2 class="section-title">Ton parcours en six missions</h2><div class="zoneanalyses">${allStats().map(z=>`<article class="zone-card"><h3>${esc(missions[z.mi].icon)} ${esc(missions[z.mi].name)}</h3><strong>${humanZone(z)}</strong><div class="zone-bar" role="progressbar" aria-label="Réponses correctes du premier coup" aria-valuemin="0" aria-valuemax="${z.total}" aria-valuenow="${z.first}"><div style="width:${Math.round(z.ratio*100)}%"></div></div><p class="numbers">${z.first}/${z.total} du premier coup · ${z.recovered} rattrapée(s) · ${z.revealed} perdue(s)</p></article>`).join('')}</div>
 <div class="level-scale"><b>Les niveaux sont des repères de jeu :</b> ${esc(levelScale())}. Ils ne constituent pas une évaluation certificative.</div>
 <div class="mission-frame end-actions"><strong>TON BILAN À CONSERVER</strong><p>Le fichier téléchargé reprend la présentation graphique du jeu, ton niveau, les résultats des six missions et ton analyse personnelle. Il peut être ouvert hors ligne et imprimé en PDF.</p><div class="actions"><button class="btn" data-action="download-html">📥 Télécharger mon bilan illustré</button><button class="btn secondary" data-action="restart">↻ Rejouer</button></div><p class="privacy-foot">Ton pseudo et tes réponses sont traités uniquement dans ce navigateur. Rien n’est envoyé à un serveur par le jeu.</p></div>`;
}

function render(){status();stage.innerHTML=S.mode==='welcome'?welcome():S.mode==='play'?question():S.mode==='clear'?cleared():finish();}
function pick(n){
 if(S.mode!=='play'||S.ok||S.revealed)return;
 const q=missions[S.mi].questions[S.qi];
 // Un même choix erroné ne peut pas être sélectionné une seconde fois.
 if(S.attempts.includes(n))return;
 S.selected=n;S.attempts.push(n);
 if(n===q.correct){
   S.ok=true;S.score=Math.min(maxStars,S.score+STAR_BONUS);S.lastDelta=STAR_BONUS;
   S.message=encouragement(S.tries?'recovered':'first');
   S.completed.push({mi:S.mi,qi:S.qi,choice:n,result:'correct',tries:S.tries,points:STAR_BONUS,attempts:[...S.attempts],hint:S.usedHint});
 }else{
   S.tries++;S.mistakes++;const lost=Math.min(S.score,STAR_MISTAKE);S.score-=lost;S.questionLoss+=lost;S.lastDelta=-lost;
   if(S.tries>=2){
     S.revealed=true;S.message=encouragement('lost');
     S.completed.push({mi:S.mi,qi:S.qi,choice:null,result:'lost',tries:S.tries,points:-S.questionLoss,attempts:[...S.attempts],hint:S.usedHint});
   }else S.message=encouragement('retry');
 }
 render();
}
function next(){if(!(S.ok||S.revealed))return;const m=missions[S.mi];if(S.qi+1<m.questions.length){S.qi++;S.selected=null;S.tries=0;S.ok=false;S.revealed=false;S.hint=false;S.usedHint=false;S.attempts=[];S.lastDelta=0;S.questionLoss=0;S.mode='play';}else S.mode='clear';render();window.scrollTo({top:0,behavior:'smooth'});}
function nextZone(){if(S.mode!=='clear')return;if(S.mi===5)S.mode='finish';else{S.mi++;S.qi=0;S.selected=null;S.tries=0;S.revealed=false;S.ok=false;S.hint=false;S.usedHint=false;S.attempts=[];S.lastDelta=0;S.questionLoss=0;S.mode='play';}render();window.scrollTo({top:0,behavior:'smooth'});}
function reportText(){const st=formativeSummary(),l=level();const out=[
 'LE DOSSIER IMPOSSIBLE — RAPPORT PERSONNEL',
 `Joueur : ${S.playerName}`,`Niveau dans le jeu : ${l.name}`,`Étoiles : ${S.score}/${maxStars}`,
 `Réponses au premier essai : ${st.first}/${nQuestions}`,`Réponses rattrapées : ${st.recovered}`,`Questions perdues : ${st.revealed}`,`Erreurs : ${st.errors}`,'',
 'CE QUE RÉVÈLENT TES DÉCISIONS',...personalNarrative(),'','PARCOURS PAR MISSION'];
 allStats().forEach(z=>{out.push(`${missions[z.mi].name} : ${z.first}/${z.total} du premier coup ; ${z.recovered} rattrapée(s) ; ${z.revealed} perdue(s).`);});
 out.push('','Niveaux et étoiles : repères propres au jeu, sans valeur certificative.','Le jeu ne transmet pas tes réponses à un serveur.');
 return out.join('\n');}

function reportHTML(){const l=level(),st=formativeSummary(),stats=allStats(),prog=Math.round(100*S.score/maxStars);
 const missionCards=stats.map(z=>`<article class="zone-card"><h3>${esc(missions[z.mi].icon)} ${esc(missions[z.mi].name)}</h3><span class="zone-label">${esc(humanZone(z))}</span><div class="zone-bar"><span style="width:${Math.round(100*z.ratio)}%"></span></div><p>${z.first}/${z.total} du premier coup · ${z.recovered} rattrapée(s) · ${z.revealed} perdue(s)</p></article>`).join('');
 const story=personalNarrative().map(p=>`<p>${esc(p)}</p>`).join('');
 return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilan personnel — ${esc(S.playerName)} — Le dossier impossible</title>
 <style>
 :root{--green:#41bc72;--ink:#254058;--muted:#61798c;--line:#dfeaf0;--sky:#ecf8fe}
 *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 6% 0%,#d9f9dd,transparent 36%),radial-gradient(circle at 96% 20%,#e6e5ff,transparent 40%),#f0f9fb;color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
 .sheet{max-width:960px;margin:26px auto;padding:35px 39px 38px;background:white;border-radius:28px;border:2px solid #dbeaf0;box-shadow:0 18px 55px #355e6b22;overflow:hidden}
 .brand{display:flex;align-items:center;gap:13px;border-bottom:2px solid #e8f0f2;padding-bottom:17px;font-weight:950}.logo{width:52px;height:52px;border-radius:16px;background:#50c980;display:grid;place-items:center;font-size:28px;box-shadow:0 5px 0 #2e9954}.kicker{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;color:#499964;font-weight:950;margin:28px 0 6px}
 h1{font-size:clamp(2rem,4.5vw,3rem);letter-spacing:-.035em;line-height:1.12;margin:8px 0 13px}h1 em{font-style:normal;color:#35b671}h2{font-size:1.38rem;color:#31536a;margin:27px 0 13px}.lead{color:#688096;margin:0 0 24px}
 .rank{display:grid;grid-template-columns:105px 1fr;gap:22px;align-items:center;border:2px solid #c9e9d7;border-radius:23px;background:linear-gradient(110deg,#e9fbed,#f2efff);padding:22px;margin:18px 0 20px}.rank-icon{text-align:center;font-size:4rem}.rank-name{font-size:2rem;font-weight:950;color:#299657;line-height:1.15}.rank small{display:block;font-weight:950;color:#70869b;letter-spacing:.09em}.rank strong{color:#329a61}.bar{height:12px;border-radius:20px;background:#d9e9ef;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#46c873,#b8df53,#ffd16a)}
 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat{border:2px solid #e2edf2;border-radius:19px;background:#f8fcff;padding:18px 13px;text-align:center}.stat strong{display:block;font-size:1.65rem;color:#2fa967}.stat span{font-size:.79rem;color:#657d91;font-weight:750}
 .narrative{border:2px solid #cae9d8;background:#f5fff8;padding:22px 25px;border-radius:20px;margin-top:27px}.narrative h2{margin:0 0 13px}.narrative p{margin:11px 0;color:#39596a}
 .missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.zone-card{background:#f8fbff;border:2px solid #e0eaf2;border-radius:18px;padding:16px}.zone-card h3{margin:0 0 5px;font-size:1rem}.zone-label{color:#339861;font-weight:900;font-size:.84rem}.zone-bar{height:9px;background:#e2ecf1;overflow:hidden;border-radius:20px;margin:10px 0}.zone-bar span{display:block;height:100%;background:#58c97d}.zone-card p{color:#6a8192;font-size:.81rem;margin:0}
 .footer{margin-top:27px;padding:18px;border-radius:17px;background:#f1f8fd;color:#647b8c;font-size:.82rem}.print{border:0;border-radius:13px;background:#53c879;color:white;font-weight:900;padding:12px 17px;box-shadow:0 4px 0 #28964f;cursor:pointer;float:right}.print:focus-visible{outline:3px solid #f2bd45;outline-offset:4px}
 @media(max-width:680px){.sheet{margin:0;padding:19px;border-radius:0}.rank{grid-template-columns:1fr;text-align:center}.stats{grid-template-columns:repeat(2,1fr)}.missions{grid-template-columns:1fr}.print{float:none;display:block;margin-bottom:18px}}
 @media print{body{background:white;print-color-adjust:exact;-webkit-print-color-adjust:exact}.sheet{box-shadow:none;border:0;margin:0;max-width:none;padding:0}.print{display:none}.rank,.stat,.narrative,.zone-card{break-inside:avoid}}
 </style></head><body><main class="sheet"><button class="print" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button><div class="brand"><div class="logo" aria-hidden="true">📁</div><div>LE DOSSIER IMPOSSIBLE<br><small style="font-weight:600;color:#7990a0">Rapport personnel d’enquête</small></div></div><p class="kicker">MISSION ACCOMPLIE · SIX ÉTAPES</p><h1>${esc(S.playerName)}, <em>ton bilan est prêt !</em></h1><p class="lead">Ce rapport est généré à partir de tes décisions au cours du jeu.</p>
 <section class="rank"><div class="rank-icon">${esc(l.icon)}</div><div><small>TON NIVEAU DANS LE JEU</small><div class="rank-name">${esc(l.name)}</div><strong>${S.score} étoiles sur ${maxStars}</strong><div class="bar"><span style="width:${prog}%"></span></div></div></section>
 <section class="stats" aria-label="Résultats chiffrés"><div class="stat"><strong>${st.first}/${nQuestions}</strong><span>Du premier coup</span></div><div class="stat"><strong>${st.recovered}</strong><span>Rattrapées</span></div><div class="stat"><strong>${st.revealed}</strong><span>Perdues</span></div><div class="stat"><strong>${st.errors}</strong><span>Erreurs</span></div><div class="stat"><strong>${st.hints}</strong><span>Indices consultés</span></div><div class="stat"><strong>${S.score} ⭐</strong><span>Solde final</span></div></section>
 <section class="narrative"><h2>📝 Ce que révèlent tes décisions</h2>${story}</section><h2>Ton parcours en six missions</h2><section class="missions">${missionCards}</section>
 <footer class="footer">Les étoiles et les niveaux sont des repères propres à ce jeu et ne constituent pas une évaluation certificative. Ce document a été produit localement dans ton navigateur : le jeu n’a pas transmis ton prénom ni tes réponses à un serveur.</footer></main></body></html>`;
}

function downloadFile(data,type,filename){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function downloadHTML(){downloadFile(reportHTML(),'text/html;charset=utf-8','dossier-impossible_bilan-personnel.html');}

stage.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){pick(Number(choice.dataset.choice));return;}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case 'start':{const field=$('player-start');const name=(field?.value||'').trim().replace(/[\r\n\t]/g,' ').slice(0,24);if(!name){const msg=$('start-error');msg.hidden=false;msg.textContent='Indique un prénom ou un pseudo pour commencer.';field?.focus();break;}S.playerName=name;S.mode='play';render();break;}case 'hint':if(!S.hint)S.usedHint=true;S.hint=!S.hint;render();break;case 'next':next();break;case 'next-zone':nextZone();break;case 'download-html':downloadHTML();break;case 'restart':if(confirm('Recommencer le jeu ? Le parcours actuel sera effacé.')){S=freshState();render();}break;}});
render();
